<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fact Knowledge Layer{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-7xl px-6 py-4 flex items-baseline gap-6">
      <a href="/" class="text-lg font-semibold tracking-tight">Fact Knowledge Layer</a>
      <nav class="flex gap-4 text-sm">
        {% for key, label, href in [('documents','Documents','/'), ('facts','Facts','/facts'),
                                    ('conflicts','Conflict inbox','/conflicts'), ('stats','Stats','/stats')] %}
        <a href="{{ href }}"
           class="rounded px-2 py-1 {% if active == key %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">{{ label }}</a>
        {% endfor %}
      </nav>
      <span class="ml-auto text-xs text-slate-400">Devansh Behl</span>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
